[package]
name = "bluejay"
version = "0.1.0"
edition = "2024"

[dependencies]
# Wayland only: eframe's defaults enable both x11 and wayland (and pull in
# winit/default, which enables x11 again), so defaults are off and the wanted
# features are listed explicitly.
# "links" is deliberately absent. It is what wires egui's open-url command to
# `webbrowser`, which on Linux hands the URL to `xdg-open` and so starts
# whatever application registered its scheme. Nothing in the preview opens a URL
# any more, and leaving the feature off means the code that could is not
# compiled in at all — it also drops `webbrowser` and `url` from the tree.
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "wayland",
    "wgpu",
] }
pulldown-cmark = { version = "0.13.4", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
# Not used from code. eframe's "wayland" feature only reaches winit/wayland, so
# without this the build would lose client-side decorations and dlopen'd
# libwayland along with x11. Cargo unions features, so naming winit directly
# restores those two without re-enabling x11.
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "wayland",
    "wayland-csd-adwaita",
    "wayland-dlopen",
] }
