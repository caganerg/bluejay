[package]
name = "bluejay"
version = "1.0.1"
edition = "2024"
rust-version = "1.95"

[dependencies]
# Wayland only: eframe's defaults enable both x11 and wayland (and pull in
# winit/default, which enables x11 again), so defaults are off and the wanted
# features are listed explicitly.
# "links" is deliberately absent. It is what wires egui's open-url command to
# `webbrowser`, which on Linux hands the URL to `xdg-open` and so starts
# whatever application registered its scheme. Nothing in the preview opens a URL
# any more, and leaving the feature off means the code that could is not
# compiled in at all — it also drops `webbrowser` and `url` from the tree.
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "wayland",
    "wgpu",
] }
pulldown-cmark = { version = "0.13.4", default-features = false }
# Not used from code. eframe's "wayland" feature only reaches winit/wayland, so
# without this the build would lose client-side decorations and dlopen'd
# libwayland along with x11. Cargo unions features, so naming winit directly
# restores those two without re-enabling x11.
#
# The decorations are asked for in their "notitle" spelling, which draws the
# titlebar and its buttons but no title text. The titled one renders that text
# itself, and to know what to render it in it shells out to `gsettings` for
# GNOME's titlebar-font setting and then to `fc-match` to turn that name into a
# file, memory-maps whatever comes back, and falls back to a Cantarell of its
# own when either step fails. That is a font off the machine, chosen by two
# subprocesses at every launch — the one surface left that would have looked
# different on every desktop, after the app's own two typefaces were baked in.
# Without the font features, `sctk-adwaita` compiles its config and font lookup
# out altogether, so the cost of this is the word "bluejay" in the titlebar.
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "wayland",
    "wayland-csd-adwaita-notitle",
    "wayland-dlopen",
] }

[profile.release]
# Panic without the unwinding machinery. Nothing here relies on it: eframe does
# not catch a panic, so the window is lost either way, and the one thing a
# rewind would still do — run `Drop` on the way out — is not what any cleanup in
# this app is built on. `write_atomic` removes its scratch file by hand, and the
# only `Drop` written anywhere is the tests' scratch directory, which is built
# under the dev profile and so keeps its unwinding. The panic message and, with
# `RUST_BACKTRACE`, the backtrace are still printed. It takes 3.1 MB off the
# binary; it does not take `libgcc_s` off the link, because the backtrace still
# reaches for it.
panic = "abort"

# The symbol table is 3.8 MB of the binary and nothing reads it: a panic prints
# its message and, with `RUST_BACKTRACE`, a backtrace, and neither needs these.
strip = true
# Optimise across crate boundaries rather than each on its own. egui, wgpu and
# winit are the bulk of the binary and are called through generics, which is the
# case this helps most; one codegen unit is what lets it see the whole of them.
# Together they take the release build from about a minute and a half to about
# two and a half, which is a debug build's business and this is not one.
lto = "fat"
codegen-units = 1
